[workspace]
members = ["crates/pulse-core", "crates/pulse-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
pdf-extract = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1