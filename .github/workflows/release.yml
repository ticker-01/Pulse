name: Сборка приложений

# Ручной запуск из вкладки Actions и автоматически по тегу v*.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Символы в релизе не нужны — бинарник меньше.
  RUSTFLAGS: "-C strip=symbols"

defaults:
  run:
    # Все команды выполняются в каталоге Rust-воркспейса.
    working-directory: pulse-desktop

jobs:
  test:
    name: Тесты и clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pulse-desktop

      - name: Тесты
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  linux:
    name: Linux x86_64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pulse-desktop

      - name: Собрать
        run: cargo build --release -p pulse-app

      - name: Упаковать
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/pulse-app dist/mgkap
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=МГКАП' \
            'Comment=Расписание колледжа, звонки и успеваемость' \
            'Exec=mgkap' \
            'Terminal=false' \
            'Categories=Education;' > dist/mgkap.desktop
          tar -czf mgkap-linux-x86_64.tar.gz -C dist .
          ls -lh mgkap-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: mgkap-linux-x86_64
          path: pulse-desktop/mgkap-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pulse-desktop

      - name: Собрать
        run: cargo build --release -p pulse-app

      - name: Переименовать
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/pulse-app.exe dist/mgkap.exe
          Get-Item dist/mgkap.exe | Format-List Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: mgkap-windows-x86_64
          path: pulse-desktop/dist/mgkap.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Оба таргета собираются на Apple Silicon: Rust кросс-компилирует
          # x86_64 без дополнительного SDK, а Intel-раннеры GitHub снимают с учёта.
          - runner: macos-14
            target: x86_64-apple-darwin
            arch: x86_64
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pulse-desktop

      - name: Собрать
        run: cargo build --release -p pulse-app --target ${{ matrix.target }}

      - name: Собрать .app и .dmg
        env:
          APP_NAME: "МГКАП"
          APP_EXE: pulse-app
          BUNDLE_ID: by.mgkap.desktop
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "версия $VERSION"

          APP="dist/$APP_NAME.app"
          rm -rf dist
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp "target/$TARGET/release/$APP_EXE" "$APP/Contents/MacOS/$APP_EXE"
          chmod +x "$APP/Contents/MacOS/$APP_EXE"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            "  <key>CFBundleName</key><string>$APP_NAME</string>" \
            "  <key>CFBundleDisplayName</key><string>$APP_NAME</string>" \
            "  <key>CFBundleExecutable</key><string>$APP_EXE</string>" \
            "  <key>CFBundleIdentifier</key><string>$BUNDLE_ID</string>" \
            '  <key>CFBundlePackageType</key><string>APPL</string>' \
            "  <key>CFBundleShortVersionString</key><string>$VERSION</string>" \
            "  <key>CFBundleVersion</key><string>$VERSION</string>" \
            '  <key>LSMinimumSystemVersion</key><string>11.0</string>' \
            '  <key>NSHighResolutionCapable</key><true/>' \
            '  <key>NSSupportsAutomaticGraphicsSwitching</key><true/>' \
            '</dict>' \
            '</plist>' > "$APP/Contents/Info.plist"

          plutil -lint "$APP/Contents/Info.plist"

          # Подпись ad-hoc: сертификат Apple не нужен, но на Apple Silicon
          # неподписанный бинарник не запускается вовсе.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          echo "подпись ok"

          OUT="mgkap-macos-$ARCH"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT.zip"
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP" -ov -format UDZO "$OUT.dmg"
          ls -lh "$OUT.zip" "$OUT.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: mgkap-macos-${{ matrix.arch }}
          path: |
            pulse-desktop/mgkap-macos-${{ matrix.arch }}.zip
            pulse-desktop/mgkap-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error