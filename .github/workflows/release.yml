name: Сборка приложений

# Ручной запуск из вкладки Actions и автоматически по тегу v*.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Символы в релизе не нужны — бинарник меньше.
  RUSTFLAGS: "-C strip=symbols"

defaults:
  run:
    # Все команды выполняются в каталоге Rust-воркспейса.
    working-directory: pulse-desktop

jobs:
  test:
    name: Тесты и clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pulse-desktop

      - name: Тесты
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  linux:
    name: Linux x86_64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pulse-desktop

      - name: Собрать
        run: cargo build --release -p pulse-app

      - name: Упаковать
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/pulse-app dist/mgkap
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=МГКАП' \
            'Comment=Расписание колледжа, звонки и успеваемость' \
            'Exec=mgkap' \
            'Terminal=false' \
            'Categories=Education;' > dist/mgkap.desktop
          tar -czf mgkap-linux-x86_64.tar.gz -C dist .
          ls -lh mgkap-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: mgkap-linux-x86_64
          path: pulse-desktop/mgkap-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pulse-desktop

      - name: Собрать
        run: cargo build --release -p pulse-app
        # Статический CRT: exe запускается без установки Visual C++ Redistributable.
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Переименовать
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/pulse-app.exe dist/mgkap.exe
          Get-Item dist/mgkap.exe | Format-List Name,Length

      - name: Запуск приложения (smoke)
        shell: pwsh
        run: |
          $env:PULSE_DATA_DIR = Join-Path $env:RUNNER_TEMP "mgkap-smoke"
          Remove-Item -Recurse -Force $env:PULSE_DATA_DIR -ErrorAction SilentlyContinue
          $log = Join-Path $env:RUNNER_TEMP "mgkap-smoke.log"
          $out = Join-Path $env:RUNNER_TEMP "mgkap-smoke-out.log"

          $p = Start-Process -FilePath "dist/mgkap.exe" -PassThru `
            -RedirectStandardError $log -RedirectStandardOutput $out
          $waited = 0
          $fetched = $false
          while ($waited -lt 60) {
            Start-Sleep -Seconds 1
            $waited++
            if ($p.HasExited) { break }
            if (Test-Path (Join-Path $env:PULSE_DATA_DIR "schedule.json")) {
              $fetched = $true
              Start-Sleep -Seconds 3
              break
            }
          }
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }

          Write-Host "прожил секунд: $waited"
          Write-Host "расписание скачано: $fetched"
          Write-Host "--- лог:"
          Get-Content $log -ErrorAction SilentlyContinue
          Write-Host "--- файлы данных:"
          Get-ChildItem $env:PULSE_DATA_DIR -ErrorAction SilentlyContinue |
            Format-Table Name, Length

          $text = (Get-Content $log -Raw -ErrorAction SilentlyContinue)
          if ($text -match "panic") {
            throw "в логе паника"
          }
          if (-not $alive) {
            throw "mgkap.exe завершился сам за $waited с (код $($p.ExitCode))"
          }
          if ($waited -lt 10) {
            throw "приложение прожило меньше 10 секунд — старт сломан"
          }
          if (-not $fetched) {
            Write-Host "::warning::сайт колледжа не ответил за минуту — проверено только, что приложение стартует"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: mgkap-windows-x86_64
          path: pulse-desktop/dist/mgkap.exe
          if-no-files-found: error

  macos:
    name: macOS
    needs: test
    # macos-14 снят с учёта 02.11.2026, актуальны macos-latest (26) и macos-15.
    # Оба таргета собираются на одном Apple Silicon раннере: Rust кросс-компилирует
    # x86_64 на arm64 без отдельного SDK, а минуты macOS самые дорогие.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pulse-desktop

      - name: Собрать обе архитектуры
        run: |
          set -euo pipefail
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --release -p pulse-app --target "$target"
          done

      - name: Собрать .app и .dmg
        env:
          APP_NAME: "МГКАП"
          APP_EXE: pulse-app
          BUNDLE_ID: by.mgkap.desktop
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "версия $VERSION"

          # Собирает .app из готового бинарника: plist, подпись ad-hoc.
          # Сертификат Apple не нужен, но на Apple Silicon неподписанный
          # бинарник не запускается вовсе.
          make_app() {
            local binary="$1" app="$2"
            rm -rf "$app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "$binary" "$app/Contents/MacOS/$APP_EXE"
            chmod +x "$app/Contents/MacOS/$APP_EXE"

            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              "  <key>CFBundleName</key><string>$APP_NAME</string>" \
              "  <key>CFBundleDisplayName</key><string>$APP_NAME</string>" \
              "  <key>CFBundleExecutable</key><string>$APP_EXE</string>" \
              "  <key>CFBundleIdentifier</key><string>$BUNDLE_ID</string>" \
              '  <key>CFBundlePackageType</key><string>APPL</string>' \
              "  <key>CFBundleShortVersionString</key><string>$VERSION</string>" \
              "  <key>CFBundleVersion</key><string>$VERSION</string>" \
              '  <key>LSMinimumSystemVersion</key><string>11.0</string>' \
              '  <key>NSHighResolutionCapable</key><true/>' \
              '  <key>NSSupportsAutomaticGraphicsSwitching</key><true/>' \
              '</dict>' \
              '</plist>' > "$app/Contents/Info.plist"

            plutil -lint "$app/Contents/Info.plist"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
          }

          # Отдельно под каждую архитектуру и один общий бинарник (universal2).
          for arch in aarch64 x86_64 universal; do
            case "$arch" in
              universal)
                mkdir -p target/universal
                lipo -create \
                  -output "target/universal/$APP_EXE" \
                  "target/x86_64-apple-darwin/release/$APP_EXE" \
                  "target/aarch64-apple-darwin/release/$APP_EXE"
                lipo -info "target/universal/$APP_EXE"
                BINARY="target/universal/$APP_EXE"
                ;;
              *)
                BINARY="target/$arch-apple-darwin/release/$APP_EXE"
                ;;
            esac

            rm -rf dist
            APP="dist/$APP_NAME.app"
            make_app "$BINARY" "$APP"

            OUT="mgkap-macos-$arch"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT.zip"
            hdiutil create -volname "$APP_NAME" -srcfolder "$APP" -ov -format UDZO "$OUT.dmg"
            file "$BINARY"
            ls -lh "$OUT.zip" "$OUT.dmg"
          done

      - name: Запуск приложения (smoke)
        env:
          APP_NAME: "МГКАП"
        run: |
          set -euo pipefail
          BINARY="dist/$APP_NAME.app/Contents/MacOS/pulse-app"
          test -x "$BINARY" || { echo "в бандле нет исполняемого файла"; exit 1; }

          # Никаких зависимостей из Homebrew: у пользователя их не будет.
          otool -L "$BINARY"
          if otool -L "$BINARY" | grep -E "/(opt/homebrew|usr/local)/"; then
            echo "бинарник зависит от библиотек Homebrew — на чужом Mac не запустится"
            exit 1
          fi

          DATA="$RUNNER_TEMP/mgkap-smoke"
          LOG="$RUNNER_TEMP/mgkap-smoke.log"
          rm -rf "$DATA"
          PULSE_DATA_DIR="$DATA" "./$BINARY" > "$LOG" 2>&1 &
          PID=$!

          # Окно создаётся в GUI-сессии раннера; если приложение падает на
          # старте (нет Metal, битый бандл), процесс умирает за секунды.
          ALIVE=0
          FETCHED=0
          for _ in $(seq 1 60); do
            sleep 1
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            ALIVE=$((ALIVE + 1))
            if [ -s "$DATA/schedule.json" ]; then
              FETCHED=1
              # Ещё пара секунд — чтобы дописались остальные файлы.
              sleep 3
              break
            fi
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          echo "--- прожил секунд: $ALIVE"
          echo "--- расписание скачано: $FETCHED"
          echo "--- лог приложения:"; cat "$LOG" || true
          echo "--- файлы данных:"; ls -l "$DATA" || true

          if grep -qiE "panic|thread '.*' panicked" "$LOG"; then
            echo "в логе паника"
            exit 1
          fi
          if [ "$ALIVE" -lt 10 ]; then
            echo "приложение прожило меньше 10 секунд — старт сломан"
            exit 1
          fi
          if [ "$FETCHED" = 1 ]; then
            echo "дней в кэше: $(grep -o '"pairNumber"' "$DATA/schedule.json" | wc -l) пар"
          else
            echo "::warning::сайт колледжа не ответил за минуту — проверено только, что приложение стартует"
          fi

      - name: Скриншоты вкладок на macOS
        continue-on-error: true
        run: |
          cargo test -p pulse-app --features shots render_tabs_to_png -- --ignored --nocapture
          ls -l /tmp/pulse-shots

      - name: Скриншоты (артефакт)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mgkap-macos-screenshots
          path: /tmp/pulse-shots/*.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        with:
          name: mgkap-macos
          path: |
            pulse-desktop/mgkap-macos-*.zip
            pulse-desktop/mgkap-macos-*.dmg
          if-no-files-found: error

  publish:
    name: Публикация Release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          pattern: mgkap-*
          path: _release
          merge-multiple: true

      - name: Собрать релизные файлы
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION="${GITHUB_REF_NAME#v}"

          echo "=== содержимое _release ==="
          ls -la _release/ || echo "пусто"

          for f in _release/*; do
            [ -f "$f" ] || continue
            cp "$f" "release/$(basename "$f")"
            sha256sum "$f" >> release/checksums.txt
          done

          echo "--- файлы релиза ---"
          ls -lh release/
          echo "--- checksums ---"
          cat release/checksums.txt

      - name: Создать Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Автоматическая сборка $VERSION" \
            release/*